<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tako</title>
<style>
  /* Colours come from the window it is stuck to (setSkin); only the ink is always TAKO's. */
  :root {
    --goo: #111112;
    --paper: #fbfbfa;
    --bar: #fbfbfa;
    --ink: #161617;
    --muted: #77777a;
    --line: #e7e7e5;
    --card: #f1f1ef;
    --btn: #111112;
    --btn-ink: #ffffff;
    --accent: #b53a2c;
    --bar-h: 52px;
    --w: 360px;
    --corner: 11px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 13px/1.55 -apple-system, "PingFang SC", sans-serif; color: var(--ink); user-select: none; }
  #card { position: fixed; left: 0; top: 0; bottom: 0; width: var(--w); background: var(--paper);
    border: 1px solid var(--line); border-left: 0; border-radius: 0 var(--corner) var(--corner) 0;
    display: none; flex-direction: column; overflow: hidden; z-index: 1;
    box-shadow: 4px 0 18px rgba(0, 0, 0, .14); will-change: transform; transition: background-color .3s, border-color .3s; }
  /* The card grows out of the body and goes back into it. --ox/--oy is where the body is on this page (setOrigin); from there it swells past its size
     a little and settles, like the body's own ink; closing, it is drawn back in. Content is in it all the way, no blank. */
  #card { transform-origin: var(--ox, 0px) var(--oy, 50%); }
  body.open #card { display: flex; animation: grow .32s linear; }
  body.closing #card { display: flex; animation: shrink .22s cubic-bezier(.5, 0, .9, .5) forwards; }
  @keyframes grow {
    0% { transform: scale(.05, .04); border-radius: 999px; animation-timing-function: cubic-bezier(.2, .7, .4, 1); }
    58% { transform: scale(1.035, .975); border-radius: var(--corner); animation-timing-function: ease-in-out; }
    80% { transform: scale(.99, 1.012); }
    100% { transform: none; }
  }
  @keyframes shrink {
    0% { transform: none; }
    25% { transform: scale(1.02, .985); border-radius: var(--corner); }
    100% { transform: scale(.05, .04); border-radius: 999px; }
  }
  @media (prefers-reduced-motion: reduce) { body.open #card, body.closing #card { animation-duration: .01s; } }
  #grip { position: fixed; top: 0; bottom: 0; left: calc(var(--w) - 5px); width: 10px; cursor: ew-resize; z-index: 2; display: none; touch-action: none; }
  body.open #grip { display: block; }
  #grip::after { content: ""; position: absolute; left: 3px; top: 50%; width: 3px; height: 36px; margin-top: -18px; border-radius: 3px; background: var(--line); transition: background .15s; }
  #grip:hover::after, body.dragging #grip::after { background: var(--muted); }
  body.dragging, body.dragging * { cursor: ew-resize !important; }
  header { height: var(--bar-h); flex: none; padding: 0 14px 0 54px; border-bottom: 1px solid var(--line); background: var(--bar); font-weight: 600; font-size: 12px; display: flex; align-items: center; gap: 6px; transition: background-color .3s; }
  #who { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  #who:hover { color: var(--muted); }
  /* A chat app's chat unconfirmed for long: the chat before is neither named nor shown, only hidden, so an unchanged chat comes back without a redraw. */
  body.looking #log > * { visibility: hidden; }
  body.looking #who { color: var(--muted); }
  body:not(.wechat) #who { cursor: default; }
  #tick { font-weight: 400; color: var(--muted); font-size: 11px; white-space: nowrap; }
  #picker { display: none; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #picker.show { display: block; }
  #picker input { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--paper); color: inherit; user-select: text; }
  #picker button { display: block; width: 100%; text-align: left; padding: 5px 4px; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; border-radius: 6px; }
  #picker button:hover { background: var(--card); }
  #log { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; user-select: text; }
  .note { font-size: 12px; line-height: 1.5; padding-left: 10px; border-left: 2px solid var(--ink); user-select: text; }
  #tick.ear { color: var(--ink); cursor: pointer; }
  /* 做过的事: every ask in the records, over the conversation until closed */
  #hist { flex: none; width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; }
  #hist:hover, body.history #hist { background: var(--card); color: var(--ink); }
  /* 收起: only puts the panel away; the conversation and what is being done stay, and it opens again where it was. */
  #fold { flex: none; width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; }
  #fold:hover { background: var(--card); color: var(--ink); }
  /* The desktop panel is moved by its header; a window's panel stays beside its window. */
  body.floating header, body.floating header #who { cursor: grab; }
  /* On its own on the desktop it has no window beside it: a whole card, every edge drawn and rounded. */
  body.floating #card { border-left: 1px solid var(--line); border-radius: var(--corner); box-shadow: 0 6px 24px rgba(0, 0, 0, .16); }
  #history { display: none; position: absolute; left: 0; right: 0; top: var(--bar-h); bottom: 0; z-index: 4; background: var(--paper); flex-direction: column; }
  body.history #history { display: flex; }
  #history .hbar { flex: none; display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #hq { flex: 1; min-width: 0; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--paper); color: inherit; user-select: text; }
  #hq:focus { outline: 2px solid var(--btn); outline-offset: -1px; }
  #hlist { flex: 1; overflow-y: auto; padding: 4px 8px 12px; user-select: text; }
  #hlist .day { font-size: 11px; color: var(--muted); padding: 10px 6px 4px; font-weight: 600; }
  #hlist .empty { color: var(--muted); padding: 24px 6px; text-align: center; }
  .hrow { border-radius: 9px; padding: 7px 8px; cursor: pointer; }
  .hrow:hover, .hrow.open { background: var(--card); }
  .hrow .meta { display: flex; gap: 6px; font-size: 11px; color: var(--muted); }
  .hrow .meta .where { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hrow .meta .ended { flex: none; }
  .hrow .meta .ended.short { color: var(--accent); }
  .hrow .asked { margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .hrow.open .asked { display: block; }
  .hrow .more { display: none; margin-top: 8px; cursor: auto; }
  .hrow.open .more { display: block; }
  .hrow .more .md { margin-bottom: 8px; }
  .hrow .gone { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .hrow .back { border: 0; border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; font-size: 12px; padding: 2px 10px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
  #hfoot { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px 10px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  #hroot { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  #hfoot button, #hask button { flex: none; border: 0; border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; font-size: 12px; padding: 2px 10px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
  #hask { display: none; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 12px; }
  #hask.show { display: block; }
  #hask .actions { display: flex; gap: 6px; margin-top: 8px; }
  #hask button.main { background: var(--btn); color: var(--btn-ink); box-shadow: none; }
  .owner { align-self: flex-end; background: var(--btn); color: var(--btn-ink); padding: 5px 10px; border-radius: 12px 12px 3px 12px; max-width: 88%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .owner a { color: inherit; }
  .empty { color: var(--muted); margin: auto; text-align: center; font-size: 12px; padding: 0 12px; animation: hello .5s ease; }
  .tip { color: var(--muted); font-size: 12px; text-align: center; padding: 2px 12px 8px; }
  .held-list { margin: 8px 14px; text-align: left; color: var(--ink); flex-shrink: 0; }
  .held-list h2 { margin: 0; padding: 4px 0; font-size: 13px; font-weight: 650; }
  .held-list summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 8px 0; }
  .held-scroll { max-height: 220px; overflow-y: auto; padding-right: 6px; }
  .held-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .held-task { position: relative; min-width: 0; padding-left: 20px; }
  .held-task::before { content: ""; position: absolute; top: 5px; left: 0; width: 10px; height: 10px; border: 1px solid var(--muted); border-radius: 50%; }
  .held-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .held-when { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .held-row button { border: 0; background: transparent; color: inherit; padding: 0; cursor: pointer; font: inherit; text-align: left; }
  .held-row button.held-title { text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; }
  .held-row button.held-done { background: var(--btn); color: var(--btn-ink); border-radius: 8px; padding: 5px 9px; white-space: nowrap; }
  .held-secondary { grid-column: 1 / -1; padding-left: 20px; color: var(--muted); font-size: 12px; }
  .held-secondary button:hover, .held-restore:hover { text-decoration: underline; }
  .ask-line { margin-top: 6px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ask-line button, .ladder-line button { border: 0; background: var(--card); color: var(--ink); border-radius: 8px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .ladder-line { margin: 6px 14px 8px; color: var(--muted); text-align: left; font-size: 12px; }
  .ladder-line .row { display: flex; gap: 8px; margin-top: 5px; }
  .empty .try { margin-top: 10px; opacity: .8; line-height: 1.5; }
  .empty .try:empty { display: none; }
  .empty .try button { border: 0; border-radius: 9px; background: var(--card); color: var(--ink); font: inherit; padding: 6px 12px; cursor: pointer; }
  .empty .try button:hover { background: var(--line); }
  @keyframes hello { from { opacity: 0; transform: translateY(3px); } }

  /* what Tako says */
  .md { overflow-wrap: anywhere; min-width: 0; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 12px 0 5px; line-height: 1.35; font-weight: 650; }
  .md h1 { font-size: 15px; } .md h2 { font-size: 14px; } .md h3, .md h4 { font-size: 13px; }
  .md ul, .md ol { margin: 0 0 8px; padding-left: 18px; }
  .md li { margin: 2px 0; }
  .md li > p { margin: 0; }
  .md blockquote { margin: 0 0 8px; padding-left: 9px; border-left: 2px solid var(--line); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .md strong { font-weight: 650; }
  .md code { font: 12px/1.45 ui-monospace, Menlo, monospace; background: var(--card); padding: 1px 4px; border-radius: 4px; }
  .md a { color: inherit; text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 2px; }
  .md a.source { display: inline-flex; align-items: center; max-width: 100%; text-decoration: none; background: var(--card); border-radius: 6px; padding: 0 6px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: baseline; }
  .md a.source:hover { background: var(--line); }
  .block { position: relative; background: var(--card); border-radius: 10px; margin: 0 0 8px; }
  .block pre { margin: 0; padding: 8px 10px 30px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, Menlo, monospace; }
  .draft { padding: 9px 11px 36px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  .tools { position: absolute; right: 6px; bottom: 5px; display: flex; gap: 4px; }
  .tools button, .card-actions button, .file button { border: 0; border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; font-size: 12px; padding: 2px 10px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
  .tools button.main, .card-actions button.main { background: var(--btn); color: var(--btn-ink); box-shadow: none; }
  .tools button:disabled { opacity: .55; cursor: default; }
  .table-wrap { position: relative; margin: 0 0 8px; }
  .table-scroll { overflow-x: auto; }
  .table-wrap table { border-collapse: collapse; font-size: 12px; width: max-content; min-width: 100%; }
  .table-wrap th, .table-wrap td { border-bottom: 1px solid var(--line); padding: 4px 9px 4px 0; text-align: left; vertical-align: top; max-width: 260px; }
  .table-wrap th { font-weight: 650; }
  .table-wrap > button { position: absolute; right: 0; top: -2px; opacity: 0; border: 0; border-radius: 6px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); color: inherit; font: inherit; font-size: 11px; padding: 0 7px; cursor: pointer; transition: opacity .12s; }
  .table-wrap:hover > button { opacity: 1; }
  .md img { display: block; max-width: 100%; max-height: 260px; border-radius: 8px; margin: 0 0 8px; cursor: zoom-in; }
  .file { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 10px; padding: 7px 8px 7px 10px; margin: 0 0 8px; user-select: none; }
  .file .kind { flex: none; font: 600 10px/1 ui-monospace, Menlo, monospace; color: var(--btn-ink); background: var(--btn); border-radius: 4px; padding: 3px 4px; text-transform: uppercase; }
  .file .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .file button { flex: none; padding: 1px 8px; }
  .steps { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .steps summary { cursor: pointer; list-style: none; }
  .steps summary::-webkit-details-marker { display: none; }
  .steps summary::before { content: "▸ "; }
  .steps[open] summary::before { content: "▾ "; }
  .steps div { padding-left: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* one thing, everything the owner said in it: a row each, with where it stands (Turns._join, receipts) */
  .items { margin: 0 0 8px; padding: 6px 8px; background: var(--card); border-radius: 10px; font-size: 12px; }
  .items div { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; }
  .items .n { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
  .items .t { flex: 1; min-width: 0; }
  .items .w { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .items .d { display: block; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
  .items .s { flex: none; font-size: 11px; color: var(--muted); }
  .items .s.done { color: var(--ink); }
  .items .s.ask { color: var(--btn-ink); background: var(--btn); border-radius: 4px; padding: 0 5px; }
  .items .s.no { text-decoration: line-through; text-decoration-color: var(--muted); }
  #others { flex: none; padding: 0 14px; font-size: 11px; color: var(--muted); }
  #others div { padding-bottom: 6px; }
  /* A job done or waiting elsewhere: the line itself takes the owner there. */
  #others .go { margin: 0 -6px 3px; padding: 3px 6px; border-radius: 6px; cursor: pointer; outline: none;
    transition: color .18s ease, background-color .18s ease, transform .12s ease, opacity .25s ease; }
  #others .go::after { content: "→"; display: inline-block; margin-left: 5px; transition: transform .22s cubic-bezier(.2, .8, .2, 1); }
  #others .go:hover, #others .go:focus-visible { color: var(--ink); background: var(--card); }
  #others .go:hover::after, #others .go:focus-visible::after { transform: translateX(3px); }
  #others .go:active { transform: scale(.98); }
  #others .go.leaving { opacity: 0; transform: translateX(10px); pointer-events: none; }
  #others .new { animation: hello .35s ease; }
  @media (prefers-reduced-motion: reduce) { #others .go, #others .go::after, #others .new { transition: none; animation: none; } }
  #live { display: none; flex: none; padding: 0 14px 10px; max-height: 60%; overflow: hidden auto; user-select: text; }
  #live.show { display: block; }
  #live .now { font-size: 11px; color: var(--muted); }
  #live .now::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); margin-left: 4px; vertical-align: 1px; animation: throb 1s ease-in-out infinite; }
  @keyframes throb { 50% { transform: scale(.45); opacity: .4; } }

  /* cards that wait for the owner */
  #cards { flex: none; display: none; flex-direction: column; gap: 8px; padding: 0 12px 10px; }
  #cards.show { display: flex; }
  .ask { background: var(--card); border-radius: 10px; padding: 9px 11px; font-size: 12px; }
  .ask .title { font-weight: 650; margin-bottom: 3px; }
  .ask .body { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 160px; overflow: auto; user-select: text; }
  .ask .body { max-height: 180px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .card-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-top: 7px; }
  .card-actions button { padding: 3px 12px; white-space: nowrap; }

  /* one thing at a time above the conversation: a step of setting up, or a new version */
  #notice { flex: none; display: none; margin: 0 12px 10px; padding: 10px 12px; background: var(--card); border-radius: 10px; font-size: 12px; }
  #notice.show { display: block; }
  #notice .title { font-weight: 650; margin-bottom: 3px; }
  #notice .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  #notice .chips button { border: 0; border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
  #notice .chips button.on { background: var(--btn); color: var(--btn-ink); box-shadow: none; }
  #notice .get { margin-top: 5px; opacity: .7; cursor: pointer; }
  #notice .get:hover { opacity: 1; text-decoration: underline; }
  #notice select, #notice input { width: 100%; box-sizing: border-box; margin-top: 6px; font: inherit; font-size: 12px; padding: 4px 6px; border: 0; border-radius: 6px; background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  #notice .notes { max-height: 200px; overflow: auto; user-select: text; line-height: 1.5; }
  #notice .notes h3 { font-size: 12px; margin: 8px 0 2px; }
  #notice .notes ul { margin: 2px 0; padding-left: 16px; }
  #notice .notes p { margin: 2px 0; }
  #notice .meter { height: 3px; margin-top: 8px; border-radius: 2px; background: var(--line); overflow: hidden; }
  #notice .meter i { display: block; height: 100%; background: var(--btn); transition: width .2s; }
  #notice .why { color: var(--accent); margin-top: 5px; }
  #notice .choice { display: block; width: 100%; text-align: left; margin-top: 7px; padding: 7px 10px; border: 0; border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
  #notice .choice:hover { box-shadow: inset 0 0 0 1px var(--muted); }
  #notice .choice .name { font-weight: 600; }
  #notice .choice .sub { color: var(--muted); margin-top: 1px; }
  #notice .choice .why { margin-top: 1px; }

  #err { display: none; font-size: 12px; padding: 0 14px 6px; }
  #err { color: var(--accent); }
  #err.show { display: block; }
  /* the box the owner talks in: what they attached, what they say, then + and send */
  form { flex: none; margin: 2px 10px 10px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: 0 1px 5px rgba(0, 0, 0, .07); transition: border-color .15s; }
  form:focus-within { border-color: var(--muted); }
  #attached { display: none; flex-wrap: wrap; gap: 6px; padding: 8px 8px 0; max-height: 156px; overflow-y: auto; }
  #attached.show { display: flex; }
  .tile { position: relative; flex: none; height: 64px; border-radius: 9px; background: var(--card); cursor: pointer; }
  .tile.pic { width: 64px; }
  .tile.pic img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--line); }
  .tile.doc { display: flex; align-items: center; gap: 8px; max-width: 190px; padding: 0 24px 0 8px; }
  .tile.doc .kind { flex: none; font: 600 10px/1 ui-monospace, Menlo, monospace; color: var(--btn-ink); background: var(--btn); border-radius: 4px; padding: 3px 4px; text-transform: uppercase; }
  .tile.doc b { font-weight: 400; font-size: 11px; line-height: 1.3; max-height: 2.6em; overflow: hidden; overflow-wrap: anywhere; }
  /* what the owner pointed at on the window: the ring's number, and what is there */
  .tile.point { display: flex; align-items: center; gap: 6px; height: 32px; max-width: 100%; padding: 0 24px 0 18px; }
  .tile.point .kind { flex: none; font: 600 10px/1 -apple-system, sans-serif; color: var(--btn-ink); background: var(--btn); border-radius: 4px; padding: 3px 4px; }
  .tile.point b { font-weight: 400; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tile .no { position: absolute; left: -4px; top: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--btn); color: var(--btn-ink); font-size: 11px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--paper); }
  #attached { padding-left: 10px; }
  .tile button { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: var(--btn); color: var(--btn-ink); cursor: pointer; opacity: 0; transition: opacity .12s; }
  .tile:hover button, .tile button:focus-visible { opacity: 1; }
  #say { width: 100%; padding: 10px 12px 3px; border: 0; outline: 0; font: inherit; background: transparent; color: inherit; user-select: text; resize: none; max-height: 132px; line-height: 1.45; display: block; }
  #say::placeholder { color: var(--muted); }
  #picker input:focus { outline: 2px solid var(--btn); outline-offset: -1px; }
  .compose { display: flex; align-items: center; justify-content: space-between; padding: 4px 7px 7px; }
  .compose button { width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; cursor: pointer; }
  .compose svg { display: block; }
  #add { background: none; color: var(--muted); }
  #add:hover { background: var(--card); color: var(--ink); }
  #send { background: var(--btn); color: var(--btn-ink); transition: opacity .12s; }
  #send:disabled { opacity: .28; cursor: default; }
  #send .stop, #send.stopping .go { display: none; }
  #send.stopping .stop { display: block; }
  body.dropping #card::after { content: "松手，交给 Tako"; position: absolute; inset: 8px; z-index: 5; display: grid; place-items: center; border: 1.5px dashed var(--btn); border-radius: 12px; background: var(--paper); opacity: .94; font-weight: 600; pointer-events: none; }
  .owner img { display: block; max-width: 180px; max-height: 180px; margin-top: 4px; border-radius: 8px; cursor: zoom-in; }
  .owner img:first-child { margin-top: 0; }
</style>
</head>
<body>
<section id="card" aria-label="Tako">
  <header><button id="who" title="换一段对话" type="button">Tako</button><span id="tick"></span><button id="hist" type="button" title="做过的事" aria-label="做过的事"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 4.8V8l2.2 1.6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="fold" type="button" title="收起（双击 Tako 或按 esc 也行）" aria-label="收起"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button></header>
  <section id="history" aria-label="做过的事">
    <div class="hbar"><input id="hq" placeholder="搜做过的事、文件名" aria-label="搜做过的事"></div>
    <div id="hlist"></div>
    <div id="hask" role="dialog"></div>
    <div id="hfoot"><span id="hroot"></span><button id="hopen" type="button">打开</button><button id="hmove" type="button">换位置…</button></div>
  </section>
  <div id="picker"><input id="q" placeholder="搜索对话名称" aria-label="搜索对话"><div id="hits"></div></div>
  <div id="notice" role="status"></div>
  <div id="held-list" class="held-list" hidden></div>
  <div id="log"></div>
  <div id="ladder-line" class="ladder-line" hidden></div>
  <div id="others" aria-live="polite"></div>
  <div id="live" aria-live="polite"></div>
  <div id="cards"></div>
  <div id="err" role="alert"></div>
  <form id="f">
    <div id="attached"></div>
    <textarea id="say" rows="1" placeholder="跟 Tako 说…" aria-label="跟 Tako 说"></textarea>
    <div class="compose">
      <button id="add" type="button" title="添加文件或图片，也可以直接拖进来" aria-label="添加文件或图片"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>
      <button id="send" disabled aria-label="发送"><svg class="go" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M3.75 7.75 8 3.5l4.25 4.25" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="stop" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.8" fill="currentColor"/></svg></button>
    </div>
  </form>
</section>
<div id="grip" role="separator" aria-label="拖动调整宽度" aria-orientation="vertical"></div>
<script src="markdown-it.js?t=TOKEN"></script>
<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get('t') || '';
const api = (path, body) => fetch(`${path}${path.includes('?') ? '&' : '?'}t=${encodeURIComponent(token)}`,
  body ? { method: 'POST', body: JSON.stringify(body) } : {}).then((r) => r.json());
const native = window.webkit?.messageHandlers?.goo;

// ---- geometry: the side window never resizes for us; we tell it which part takes clicks ----
const MIN = 280, MAX = 712;
let width = 360, room = 99999, opened = false, seen = 0, gooState = '', gen = null, busy = false, catchingUp = true, cardsUp = false;
const cardWidth = () => Math.max(MIN, Math.min(width, MAX, Math.max(MIN, room)));
let origin = null;  // where the body is on this page (setOrigin)
function layout() {
  const w = cardWidth();
  document.documentElement.style.setProperty('--w', `${w}px`);
  placeOrigin();
  native?.postMessage({ region: [0, 0, w + 5, 100000], cardWidth: w });
}
window.setGeometry = (edge, nextRoom) => { room = nextRoom; layout(); };
// Where the body is, in this page's coordinates: the card grows out of the nearest point of its own edge and goes back
// into it there (from a point outside the card, the swelling card would be cut off by its own window).
function placeOrigin() {
  if (!origin) return;
  const root = document.documentElement.style, h = document.documentElement.clientHeight || origin.y;
  root.setProperty('--ox', `${Math.max(0, Math.min(cardWidth(), origin.x))}px`);
  root.setProperty('--oy', `${Math.max(0, Math.min(h, origin.y))}px`);
}
window.setOrigin = (x, y) => { origin = { x, y }; placeOrigin(); };
window.setWidth = (next) => { width = next; layout(); };
// The desktop panel (the app says which): held by its header, the app moves the window with the pointer (`movePanel`).
window.setFloating = (on) => document.body.classList.toggle('floating', on);
document.querySelector('header').addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || !document.body.classList.contains('floating') || e.target.closest('#hist, #fold')) return;
  e.preventDefault();
  native?.postMessage({ moveStart: true });
});
let canMove = true, canRead = true;
window.setCanMove = (can) => { canMove = can; showNotice(); };
window.setCanRead = (can) => { canRead = can; showNotice(); };

// The panel takes its material from the window beside it; the ink stays TAKO's.
const mixRGB = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const css = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
window.setSkin = (skin) => {
  const root = document.documentElement.style;
  const fg = skin.dark ? [238, 238, 240] : [22, 22, 23];
  root.setProperty('--paper', css(skin.paper));
  root.setProperty('--bar', css(skin.bar));
  root.setProperty('--ink', css(fg));
  root.setProperty('--muted', css(mixRGB(skin.paper, fg, .55)));
  root.setProperty('--line', css(mixRGB(skin.paper, fg, skin.dark ? .16 : .1)));
  root.setProperty('--card', css(mixRGB(skin.paper, fg, skin.dark ? .1 : .055)));
  root.setProperty('--btn', skin.dark ? '#ececee' : '#111112');
  root.setProperty('--btn-ink', skin.dark ? '#111112' : '#ffffff');
  root.setProperty('--bar-h', `${skin.barHeight}px`);
  root.setProperty('--corner', `${skin.corner}px`);
  document.documentElement.style.colorScheme = skin.dark ? 'dark' : 'light';
};

let closing;
window.setOpen = function setOpen(next) {
  if (next === opened) return;
  opened = next;
  clearTimeout(closing);
  document.body.classList.toggle('open', next);
  document.body.classList.toggle('closing', !next);
  layout();
  native?.postMessage({ open: next, wanted: width });
  if (next) {
    $('say').focus({ preventScroll: true });
    $('log').scrollTop = $('log').scrollHeight;
    // Opened from an answer in the bubble (a press on it, a double click on the body): that answer is what shows.
    aside = null; asideOpening = false;
    const answered = asideAt && $('log').querySelector(`[data-at="${asideAt}"]`);
    if (answered) answered.scrollIntoView({ block: 'start' });
    asideAt = 0;
  } else {
    closing = setTimeout(() => document.body.classList.remove('closing'), 230);
  }
};

$('grip').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  $('grip').setPointerCapture(e.pointerId);
  document.body.classList.add('dragging');
  native?.postMessage({ dragging: true });
  const startX = e.clientX, startWidth = cardWidth();
  const move = (m) => {
    width = Math.max(MIN, Math.min(MAX, startWidth + m.clientX - startX));
    layout();
    native?.postMessage({ wanted: width });   // past the screen edge, the window moves over to make room
  };
  const up = () => {
    $('grip').removeEventListener('pointermove', move);
    document.body.classList.remove('dragging');
    native?.postMessage({ dragging: false, width });
  };
  $('grip').addEventListener('pointermove', move);
  $('grip').addEventListener('pointerup', up, { once: true });
  $('grip').addEventListener('pointercancel', up, { once: true });
});

// ---- rendering what Tako says ----
const md = window.markdownit({ html: false, linkify: true, breaks: true });
// CommonMark won't close ** right after Chinese punctuation (**结论：**这样). Chinese text needs it to.
const cjk = /[⺀-鿿豈-﫿＀-￯　-〿‘-”…]/;
const scanDelims = md.inline.State.prototype.scanDelims;
md.inline.State.prototype.scanDelims = function (start, canSplit) {
  const found = scanDelims.call(this, start, canSplit);
  const before = this.src[start - 1] || ' ', after = this.src[start + found.length] || ' ';
  if (found.length) {
    if ((cjk.test(after) || cjk.test(before)) && !/\s/.test(after)) found.can_open = true;
    if ((cjk.test(before) || cjk.test(after)) && !/\s/.test(before)) found.can_close = true;
  }
  return found;
};
// markdown-it refuses paths it can't parse as URLs only for dangerous schemes; local paths stay as they are.
const isImage = (path) => /\.(png|jpe?g|gif|webp|heic|heif|avif|bmp|tiff?)$/i.test(path);
const isLocal = (href) => /^(\/|~\/|file:\/\/)/.test(href);
const localPath = (href) => decodeURI(href.replace(/^file:\/\//, ''));
const fileUrl = (path) => `/file?path=${encodeURIComponent(path)}&t=${encodeURIComponent(token)}`;
const toast = (button, text) => { const was = button.textContent; button.textContent = text; setTimeout(() => { button.textContent = was; }, 1400); };
function copyText(text, button) {
  if (native) native.postMessage({ copy: text }); else navigator.clipboard.writeText(text);
  toast(button, '已复制');
}
function button(label, onclick, main) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label; b.onclick = onclick;
  if (main) b.className = 'main';
  return b;
}
function fillButton(text, files) {
  const b = button('填入', async () => {
    b.disabled = true; b.textContent = '填入中…';
    native?.postMessage({ pop: .5 });
    try {
      const r = await api('/fill', { text, files, gen });
      b.textContent = r.ok ? '已填入' : '没填入';
      if (!r.ok) { showError(r.error || '没有填入', true); native?.postMessage({ oops: true }); }
    } catch { b.textContent = '没填入'; }
    setTimeout(() => { b.disabled = false; b.textContent = '填入'; }, 1800);
  }, true);
  return b;
}
const canFill = () => !!native && !!document.body.dataset.app;
function draftCard(body) {
  const box = document.createElement('div');
  box.className = 'block draft';
  box.textContent = body;
  const tools = document.createElement('div');
  tools.className = 'tools';
  tools.append(button('复制', (e) => copyText(body, e.target)));
  if (canFill()) tools.append(fillButton(body, []));
  box.append(tools);
  return box;
}
function codeBlock(body) {
  const box = document.createElement('div');
  box.className = 'block';
  const pre = document.createElement('pre');
  pre.textContent = body;
  const tools = document.createElement('div');
  tools.className = 'tools';
  tools.append(button('复制', (e) => copyText(body, e.target)));
  box.append(pre, tools);
  return box;
}
function fileCard(path, label) {
  const row = document.createElement('div');
  row.className = 'file';
  const name = path.split('/').pop();
  const kind = document.createElement('span');
  kind.className = 'kind';
  kind.textContent = (name.includes('.') ? name.split('.').pop() : 'file').slice(0, 4);
  const title = document.createElement('span');
  title.className = 'name';
  title.textContent = label && label !== path ? label : name;
  title.title = path;
  row.append(kind, title);
  row.append(button('打开', () => native?.postMessage({ openFile: path })));
  row.append(button('定位', () => native?.postMessage({ revealFile: path })));
  if (canFill()) row.append(fillButton('', [path]));
  return row;
}
function tableBlock(table) {
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  const scroll = document.createElement('div');
  scroll.className = 'table-scroll';
  table.replaceWith(wrap);
  scroll.append(table);
  const tsv = () => [...table.rows].map((r) => [...r.cells].map((c) => c.textContent.trim()).join('\t')).join('\n');
  wrap.append(scroll, button('复制', (e) => copyText(tsv(), e.target)));
}
function renderMarkdown(text) {
  const out = document.createElement('div');
  out.className = 'md';
  out.innerHTML = md.render(text);
  out.querySelectorAll('pre > code').forEach((code) => {
    const language = (code.className.match(/language-(\S+)/) || [])[1];
    const body = code.textContent.replace(/\n$/, '');
    code.parentElement.replaceWith(language === 'draft' ? draftCard(body) : codeBlock(body));
  });
  out.querySelectorAll('table').forEach(tableBlock);
  out.querySelectorAll('img').forEach((img) => {
    const src = img.getAttribute('src') || '';
    if (isLocal(src)) {
      const path = localPath(src);
      img.src = fileUrl(path);
      img.onclick = () => native?.postMessage({ openFile: path });
    } else {
      // Loading it would tell the outside whatever is in its address; it stays a link the owner can choose to open.
      const link = document.createElement('a');
      link.href = src;
      link.textContent = img.getAttribute('alt') || '网页图片';
      img.replaceWith(link);
    }
  });
  out.querySelectorAll('a').forEach((a) => {
    const href = a.getAttribute('href') || '';
    if (isLocal(href)) {
      // A link alone in its paragraph is a file being handed over; inside a sentence it stays a link.
      const path = localPath(href);
      const parent = a.parentElement;
      const alone = parent.tagName === 'P' && parent.textContent.trim() === a.textContent.trim();
      if (alone) { parent.replaceWith(fileCard(path, a.textContent)); return; }
      a.onclick = (e) => { e.preventDefault(); native?.postMessage({ openFile: path }); };
      return;
    }
    let host = '';
    try { host = new URL(href).hostname.replace(/^www\./, ''); } catch { /* not a web link */ }
    a.title = href;
    if (host && (a.textContent === href || a.textContent.startsWith('http'))) { a.textContent = host; a.classList.add('source'); }
    else if (host) a.classList.add('source');
    a.onclick = (e) => { e.preventDefault(); if (native) native.postMessage({ openURL: href }); else window.open(href); };
  });
  return out;
}
// The list of one thing: each thing the owner said in it and where it stands, from the model's own receipts (`Turns._take_receipts`).
const ITEM_WORDS = { '收到': '收到，会一起改', '在改': '在改', '改好': '改好', '没改': '没改', '要你定': '要你定' };
function itemsBlock(items) {
  const box = document.createElement('div');
  box.className = 'items';
  items.forEach((item) => {
    const row = document.createElement('div');
    const n = document.createElement('span'), t = document.createElement('span'), state = document.createElement('span');
    n.className = 'n'; n.textContent = `${item.n}.`;
    // The owner's words, and under them what the model said it did with them: the detail lives here, not again in the answer.
    const words = document.createElement('span'); words.className = 'w'; words.textContent = item.text; words.title = item.text;
    t.className = 't'; t.append(words);
    if (item.note) { const note = document.createElement('span'); note.className = 'd'; note.textContent = item.note; t.append(note); }
    state.className = 's' + (item.state === '改好' ? ' done' : item.state === '要你定' ? ' ask' : item.state === '没改' ? ' no' : '');
    state.textContent = ITEM_WORDS[item.state] || '';
    row.append(n, t, state);
    box.append(row);
  });
  return box;
}
function stepsBlock(steps) {
  const box = document.createElement('details');
  box.className = 'steps';
  const head = document.createElement('summary');
  head.textContent = `做了 ${steps.length} 步`;
  box.append(head);
  steps.forEach((step) => { const row = document.createElement('div'); row.textContent = step; row.title = step; box.append(row); });
  return box;
}
$('tick').onclick = () => { if ($('tick').classList.contains('ear')) api('/listen/stop', {}); };

// ---- 做过的事: what the records in Tako's folder hold, newest first ----
let historyRows = [], historyRoot = '', historyToday = '';
async function loadHistory() {
  try {
    const r = await api('/history');
    historyRows = r.rows || []; historyRoot = r.root || ''; historyToday = r.today || '';
  } catch { historyRows = []; }
  drawHistory();
}
window.showHistory = () => {
  document.body.classList.add('history');
  window.setOpen(true);
  loadHistory();
  setTimeout(() => $('hq').focus(), 50);
};
function hideHistory() { document.body.classList.remove('history'); $('hask').classList.remove('show'); }
$('hist').onclick = () => (document.body.classList.contains('history') ? hideHistory() : window.showHistory());
$('hq').oninput = () => drawHistory();
$('hopen').onclick = () => native?.postMessage({ openFile: historyRoot });
$('hmove').onclick = () => native?.postMessage({ chooseFolder: historyRoot });
function dayName(day) {
  if (day === historyToday) return '今天';
  const t = new Date(`${historyToday}T12:00:00`), d = new Date(`${day}T12:00:00`);
  const back = Math.round((t - d) / 86400000);
  return back === 1 ? '昨天' : back === 2 ? '前天' : `${+day.slice(5, 7)}月${+day.slice(8, 10)}日`;
}
function historyRow(row) {
  const box = document.createElement('div');
  box.className = 'hrow';
  const meta = document.createElement('div');
  meta.className = 'meta';
  const when = document.createElement('span'); when.textContent = row.time.slice(-5);
  const where = document.createElement('span'); where.className = 'where'; where.textContent = row.where || '某个窗口';
  const ended = document.createElement('span');
  ended.className = row.ended === '答完了' ? 'ended' : 'ended short';
  const files = row.files.length ? ` · ${row.files.length} 个文件` : '';
  ended.textContent = (row.ended === '答完了' ? '' : row.ended) + files;
  meta.append(when, where, ended);
  const asked = document.createElement('div');
  asked.className = 'asked';
  asked.textContent = row.asked;
  const more = document.createElement('div');
  more.className = 'more';
  box.append(meta, asked, more);
  box.onclick = (e) => {
    if (more.contains(e.target)) return;
    if (!more.childElementCount) {
      row.replies.forEach((reply) => {
        try { more.append(renderMarkdown(reply.text)); } catch { const plain = document.createElement('div'); plain.textContent = reply.text; more.append(plain); }
      });
      row.files.forEach((file) => {
        if (file.there) more.append(fileCard(file.path, file.name));
        else { const gone = document.createElement('div'); gone.className = 'gone'; gone.textContent = `${file.name}（已不在）`; more.append(gone); }
      });
      if (row.touched.length) { const touched = document.createElement('div'); touched.className = 'gone'; touched.textContent = `改动了：${row.touched.join('、')}（原样备份过）`; more.append(touched); }
      if (row.window) {
        const back = button(row.chat ? `回到「${row.chat}」` : '回到那个窗口', () => {
          hideHistory();
          api('/go', { key: row.key || '', window: String(row.window) }).catch(() => {});
          native?.postMessage({ goTo: String(row.window), chat: row.chat || '' });
        });
        back.className = 'back';
        more.append(back);
      }
    }
    box.classList.toggle('open');
  };
  return box;
}
function drawHistory() {
  setText($('hroot'), `\u200e${historyRoot.replace(/^\/Users\/[^/]+/, '~')}\u200e`);
  $('hroot').title = historyRoot;
  const q = $('hq').value.trim().toLowerCase();
  const rows = q ? historyRows.filter((row) => [row.where, row.asked, ...row.files.map((f) => f.name), ...row.replies.map((r) => r.text)].join(' ').toLowerCase().includes(q)) : historyRows;
  const out = [];
  let day = '';
  rows.forEach((row) => {
    if (row.day !== day) { day = row.day; const head = document.createElement('div'); head.className = 'day'; head.textContent = dayName(day); out.push(head); }
    out.push(historyRow(row));
  });
  if (!out.length) { const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = q ? '没有找到' : '还没有做过的事'; out.push(empty); }
  $('hlist').replaceChildren(...out);
}
// The owner picked another folder (换位置…, or 做过的事… in the menu): one question, then everything is in one place again.
window.folderChosen = (path) => {
  if (!document.body.classList.contains('history')) window.showHistory();
  const ask = $('hask');
  const text = document.createElement('div');
  text.textContent = `以后放在 ${path.replace(/^\/Users\/[^/]+/, '~')}。以前的对话记录和产出文件也搬过去吗？`;
  const actions = document.createElement('div');
  actions.className = 'actions';
  const choose = (move) => async () => {
    ask.classList.remove('show');
    const r = await api('/folder', { path, move }).catch(() => ({ ok: false, error: '没有回应，再试一次' }));
    if (!r.ok) showError(r.error || '没换成', true);
    loadHistory();
  };
  actions.append(button('搬过去', choose(true), true), button('不用，只放以后的', choose(false)), button('取消', () => ask.classList.remove('show')));
  ask.replaceChildren(text, actions);
  ask.classList.add('show');
};
function bubble(event) {
  const row = document.createElement('div');
  if (event.at) row.dataset.at = event.at;
  if (event.role === 'note') { row.className = 'note'; row.textContent = event.text; return row; }

  const short = (t, w = 24) => { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > w ? `${t.slice(0, w)}…` : t; };
  const text = String(p.text || '');
  const said = text.includes('圈里的字：') ? text.split('圈里的字：')[1] : (p.kind === '图片局部' ? '' : text);
  const first = said.trim() ? `「${short(said.trim().split('\n')[0])}」` : '';
  if (p.kind === '图片局部') return ['', first ? `图上${first}` : '图的一角'];
  if (['区域', '文字', '条目', ''].includes(p.kind || '')) return ['', first || short(p.name) || (p.pending ? '…' : '这一块')];
  const host = String(p.url || '').split('//').pop().split('/')[0];
  return [p.kind, short(p.name || host || String(p.path || '').split('/').pop())];
}
// A tile names what the ring is round: a link, an image, a run of words. Pressing it puts its number in the sentence.
function pointTile(p) {
  const tile = document.createElement('div');
  tile.className = 'tile point';
  tile.title = [p.kind, p.name, p.url || p.path, p.text].filter(Boolean).join('\n').slice(0, 400);
  const no = document.createElement('span');
  no.className = 'no';
  no.textContent = p.n;
  const [what, said] = pointLabel(p);
  const label = document.createElement('b');
  label.textContent = said;
  const kind = document.createElement('span');
  kind.className = 'kind';
  kind.textContent = what;
  if (!what) kind.hidden = true;
  tile.onclick = () => {
    const say = $('say'), at = say.selectionStart ?? say.value.length;
    say.value = say.value.slice(0, at) + circled(p.n) + say.value.slice(say.selectionEnd ?? at);
    say.focus({ preventScroll: true });
    say.selectionStart = say.selectionEnd = at + 1;
    grow(); updateSend();
  };
  const remove = button('', (e) => {
    e.stopPropagation();
    points = points.filter((q) => q.n !== p.n);
    native?.postMessage({ unpoint: p.n });
    showAttached();
  });
  remove.innerHTML = '<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M1 1l6 6M7 1 1 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  remove.setAttribute('aria-label', `去掉 ${p.n}`);
  remove.title = '去掉';
  tile.append(no, kind, label, remove);
  return tile;
}
function showAttached() {
  const box = $('attached');
  box.classList.toggle('show', attachments.length + points.length > 0);
  box.replaceChildren(...[...points].sort((a, b) => a.n - b.n).map(pointTile), ...attachments.map(attachmentTile));
  updateSend();
}
window.addPoint = (p) => {
  points = [...points.filter((q) => q.n !== p.n), p];
  learn('point');
  showAttached();
  window.setOpen(true);
  native?.postMessage({ pop: .5 });
};
// Holding ⌃ on the window: the box says what a press there does.
window.setAiming = (on) => { $('say').placeholder = on ? '点一下圈住它，拖一下圈一片，拖过字就选字…' : '跟 Tako 说…'; };
window.dropPoint = (n) => { points = points.filter((q) => q.n !== n); showAttached(); };
window.addFiles = async (paths) => {
  await api('/offer', { paths });
  attachments = [...new Set([...attachments, ...paths])];
  learn('file');
  showAttached();
  window.setOpen(true);
  native?.postMessage({ pop: .7 });
};
window.setDropping = (on) => document.body.classList.toggle('dropping', on);
function grow() {
  const say = $('say');
  say.style.height = 'auto';
  say.style.height = `${Math.min(132, say.scrollHeight + 2)}px`;
}
$('say').addEventListener('input', () => { grow(); updateSend(); });
$('say').addEventListener('keydown', (e) => {
  // Enter that finishes a Chinese word in the input method must not send.
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    $('f').requestSubmit();
  }
});
$('say').addEventListener('paste', (e) => {
  const images = [...e.clipboardData.files].filter((file) => file.type.startsWith('image/'));
  if (!images.length) return;
  e.preventDefault();
  images.forEach((file) => {
    const reader = new FileReader();
    reader.onload = async () => {
      const r = await api('/upload', { name: file.name || 'paste.png', data: reader.result.split(',')[1] });
      window.addFiles([r.path]);
    };
    reader.readAsDataURL(file);
  });
});
$('f').onsubmit = async (e) => {
  e.preventDefault();
  if (busy && !$('say').value.trim()) { await api('/stop', {}); return; }
  const text = $('say').value.trim();
  if (!text && !attachments.length && !points.length) return;
  const files = attachments, pointed = [...points].sort((a, b) => a.n - b.n);
  $('say').value = '';
  attachments = [];
  points = [];
  if (pointed.length) native?.postMessage({ pointsSent: true });
  showAttached();
  grow();
  showError('');
  try {
    await api('/ask', { text, files, points: pointed });
    learn('ask');
    mayOweRing(text, pointed);
  } catch {
    // Never lose what the owner wrote: it goes back in the box.
    $('say').value = text; attachments = files; points = pointed; showAttached(); grow();
    showError('没发出去，Tako 的后台刚才断了一下，再按一次试试。', true);
    if (aside) openAside();
  }
};
// The speaking key's words (spoken, or typed in its bubble): sent by the same send as the box, with whatever is circled or
// attached here, so they come in as the newest line just as typed ones do. Anything half-typed in the box stays there.
// `beside`: on the desktop with the panel closed, the answer goes to the bubble (`takeAside`).
window.sayFromKey = (text, beside) => {
  if (beside && !opened) startAside(text);
  const typed = $('say').value;
  $('say').value = text;
  $('f').requestSubmit();
  if (!$('say').value) { $('say').value = typed; grow(); updateSend(); }
  if (beside) window.tickSoon?.(300);
};
$('add').onclick = () => { native?.postMessage({ pickFiles: true }); };
$('fold').onclick = () => window.setOpen(false);
$('who').onclick = () => {
  if (!document.body.classList.contains('wechat')) return;
  $('picker').classList.toggle('show');
  if ($('picker').classList.contains('show')) $('q').focus();
};
let searching;
$('q').oninput = () => {
  clearTimeout(searching);
  searching = setTimeout(async () => {
    const q = $('q').value.trim();
    $('hits').replaceChildren();
    if (!q) return;
    (await api(`/chats?q=${encodeURIComponent(q)}`)).forEach((chat) => {
      const b = document.createElement('button');
      b.textContent = chat.name;
      b.onclick = async () => { await api('/attach', chat); $('picker').classList.remove('show'); $('q').value = ''; $('hits').replaceChildren(); };
      $('hits').append(b);
    });
  }, 220);
};
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || !opened) return;
  if (document.body.classList.contains('history')) hideHistory(); else window.setOpen(false);
});
layout();
</script>
